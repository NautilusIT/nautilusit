name: Deploy NautilusIT

on:
    push:
        branches: [ main ]

# TODO: migrate to OIDC federated credentials to remove the long-lived AZURE_CREDENTIALS secret.
# Steps:
#   1. In Entra ID, add a federated credential on the deploy service principal scoped to
#      `repo:jonnekleijer/nautilusit:ref:refs/heads/main`.
#   2. Add repo secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID.
#   3. Add at workflow level:
#        permissions:
#          id-token: write
#          contents: read
#   4. Replace the `azure/login` step with client-id/tenant-id/subscription-id inputs.
#   5. Switch the upload step to `--auth-mode login` (requires RBAC on the storage account)
#      and disable shared-key access on stnautilusitprod once verified.

jobs:
  build:
    name: deploy website
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: azure/login@v2
      with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Stage site
      run: |
        mkdir -p dist
        cp index.html robots.txt sitemap.xml dist/
        cp -r assets dist/

    - name: Upload to blob storage
      uses: azure/CLI@v2
      with:
        inlineScript: |
          # Upload the staged site (only public-facing files)
          az storage blob upload-batch --account-name stnautilusitprod --auth-mode key -d '$web' -s dist --overwrite true
          # Remove stale artifacts uploaded by earlier full-repo deploys.
          # delete-batch is idempotent — a no-op once the blobs are gone.
          az storage blob delete-batch --account-name stnautilusitprod --auth-mode key -s '$web' --pattern 'README.md' || true
          az storage blob delete-batch --account-name stnautilusitprod --auth-mode key -s '$web' --pattern '.gitignore' || true
          az storage blob delete-batch --account-name stnautilusitprod --auth-mode key -s '$web' --pattern '.github/*' || true
          az storage blob delete-batch --account-name stnautilusitprod --auth-mode key -s '$web' --pattern '.vscode/*' || true
          az storage blob delete-batch --account-name stnautilusitprod --auth-mode key -s '$web' --pattern '.git/*' || true


    - name: Purge Cloudflare cache
      run: |
        curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
          -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
          -H "Content-Type: application/json" \
          --data '{"purge_everything":true}' \
          --fail

    - name: Logout
      run: |
            az logout
      if: always()
