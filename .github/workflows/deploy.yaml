name: Deploy NautilusIT

on:
    push:
        branches: [ main ]

jobs:
  build:
    name: deploy website
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: azure/login@v1
      with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Upload to blob storage
      uses: azure/CLI@v1
      with:
        inlineScript: |
            az storage blob upload-batch --account-name stnautilusitprod --auth-mode key -d '$web' -s . --overwrite true
      
    - name: Purge Cloudflare cache
      run: |
        curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
          -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
          -H "Content-Type: application/json" \
          --data '{"purge_everything":true}' \
          --fail

    - name: Logout
      run: |
            az logout
      if: always()
